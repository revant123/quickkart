# nginx is the ONLY public entry point (port 80 inside, 8080 on your machine).
#   /api/...  -> forwarded to the API containers
#   anything else -> the React app's static files

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Docker's internal DNS server. Re-resolving "api" every few seconds means that
  # when you run several API containers (docker compose up -d --scale api=3),
  # nginx finds all of them and spreads requests across them.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Live updates (Server-Sent Events): one long-lived response per browser.
  # Buffering must be off, or nginx would hold events back; the timeout must be
  # long, or nginx would cut idle streams (the API sends a ping every 25 s).
  location ~ ^/api/(.+/)?live$ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    set $api_upstream http://api:4000;   # "api" = the Compose service name
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 2m; # product photo uploads (the API itself allows 1 MB)
  }

  # Product illustrations rarely change: let browsers keep them for a day
  location /img/ {
    expires 1d;
    try_files $uri =404;
  }

  # Vite puts a content hash in every asset filename, so they can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Any other path (/orders/42, /admin/slots...) is a React Router page:
  # serve index.html and let the app pick the page.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
