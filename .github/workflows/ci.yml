# Continuous integration: on every push and pull request, GitHub runs the
# same checks you run locally, on a clean machine. A red X on a commit means
# something broke; the README badge shows the latest result.
name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    # Real PostgreSQL and Redis, started next to the job (like docker compose)
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: quickkart
          POSTGRES_PASSWORD: quickkart
          POSTGRES_DB: quickkart_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U quickkart -d quickkart_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests (migrations run first, Redis tests included)
        run: npm test
        env:
          TEST_REDIS_URL: redis://localhost:6380
      - name: Race-condition demo
        run: npm run demo:race

  web:
    name: Website checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check and production build
        run: npm run build
      - name: Tests
        run: npm test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build api web

      # The single image Render deploys: build it, start it against a fresh
      # PostgreSQL, and check the site, the API and the automatic sample data.
      - run: docker build -t quickkart .
      - name: Smoke-test the deploy image
        run: |
          docker network create qk
          docker run -d --name pg --network qk -e POSTGRES_USER=quickkart -e POSTGRES_PASSWORD=quickkart -e POSTGRES_DB=quickkart postgres:18
          for i in $(seq 1 30); do docker exec pg pg_isready -U quickkart -d quickkart && break; sleep 1; done
          docker run -d --name app --network qk -p 10000:10000 \
            -e DATABASE_URL=postgres://quickkart:quickkart@pg:5432/quickkart \
            -e JWT_SECRET=ci-secret-ci-secret-ci-secret-1234567 -e SEED_ON_EMPTY=true quickkart
          for i in $(seq 1 60); do curl -fs localhost:10000/api/health && break; sleep 2; done
          curl -fs localhost:10000/ | grep -q '<div id="root">'
          curl -fs localhost:10000/orders/123 | grep -q '<div id="root">'   # app routes get the page
          for i in $(seq 1 60); do [ "$(curl -fs localhost:10000/api/stores | jq length)" = "27" ] && break; sleep 3; done
          curl -fs localhost:10000/api/stores | jq -e 'length == 27'
          curl -fs "localhost:10000/api/stores/nearest?pincode=160017" | jq -e '.stores[0].delivers'
          curl -fs "localhost:10000/api/stores/1/products?limit=5" | jq -e '.items | length == 5'
      - if: always()
        run: docker logs app || true
